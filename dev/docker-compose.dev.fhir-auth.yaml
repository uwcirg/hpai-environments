# docker-compose development override for confidentialbackend
services:
  fhir-auth:
    command: sh -c "flask run --host 0.0.0.0 --port $$PORT"
    environment:
      # sets app.config.debug
      FLASK_DEBUG: true
      FLASK_ENV: development
    volumes:
    # set in .env
      - ${FHIR_AUTH_CHECKOUT_DIR}/:/opt/app
